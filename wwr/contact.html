<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash White Water Rafting | Contact Us</title>
    <meta name="description" content="Splash White Water Rafting's contact us page. This page provides the company's address and contact information, employees' profiles and a form for requesting services.">
    <meta name="author" content="Francisco Gandiola">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/splash-logo.png" alt="Splash WWR logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
    </nav>
    </header>
    <main>
        <section>
            <h1>Splash White Water Rafting</h1>
            <p>Paseo Colón & Boulevard Gales</p>
            <p>Helvecia, Santa Fe</p>
            <p>+54 999 999 999</p>
            <p>info@splashrafting.com</p>
        </section>
        <section id="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d40945.06348711853!2d-60.07566909658857!3d-31.111281781354734!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sar!4v1781297136503!5m2!1ses-419!2sar" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form>
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div>
                    <label for="purpose">Message Purpose</label>
                    <input type="radio" id="purpose" name="purpose">
                    <option value="1">General Inquiry</option>
                    <option value="2">Reservation Question</option>
                    <option value="3">Website Suggestion</option>
                </div>
                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>
                </div>
                <div>
                    <label for="newsletter">Please Suscribe me to the monthyly newsletter</label>
                    <input type="checkbox" id="newsletter" name="newsletter">
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section id="end-section">
            <h2>We Are Here to Serve You</h2>
            <div>
                <figure>
                    <img>
                    <figcaption></figcaption>
                </figure>
                <figure>
                    <img>
                    <figcaption></figcaption>
                </figure>
                <figure>
                    <img>
                    <figcaption></figcaption>
                </figure>
            </div>
        </section>      
    </main>
    <footer>
        <p>© 2026 🚩 Splash White Water Rafting 🚩 Francisco Gandiola</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook.svg" alt="Facebook logo" width="40">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram.svg" alt="Instagram logo" width="40">
            </a>
            <a href="https://web.whatsapp.com/">
                <img src="images/whatsapp.svg" alt="WhatsApp logo" width="40">
            </a>
        </nav>
    </footer>
