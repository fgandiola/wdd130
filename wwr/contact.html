<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash White Water Rafting | Contact Us</title>
    <meta name="description" content="Splash White Water Rafting's contact us page. This page provides the company's contact information and a form for requesting services.">
    <meta name="author" content="Francisco Gandiola">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/splash-logo.png" alt="Splash WWR logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
    </nav>
    </header>
    <main>
        <div class="title">
            <h1>Splash White Water Rafting</h1>
            <p>Paseo Colón & Boulevard Gales</p>
            <p>Helvecia, Santa Fe</p>
            <p>+54 999 999 999</p>
            <p>info@splashrafting.com</p>
        </div>
        <section id="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d40945.06348711853!2d-60.07566909658857!3d-31.111281781354734!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sar!4v1781297136503!5m2!1ses-419!2sar" width="375" height="280" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form>
                <fieldset>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Type your name here..." required>
                </fieldset>
                <fieldset>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Type your email here..." required>
                </fieldset>
                <fieldset class="radio-group">
                    <legend>Message Purpose</legend>
                    <div class="radio-option">
                        <input type="radio" id="inquiry" name="purpose">
                        <label for="inquiry">General Inquiry</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="reservation" name="purpose">
                        <label for="reservation">Reservation Question</label>  
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="suggestion" name="purpose">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </fieldset>
                <fieldset class="message">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>
                </fieldset>
                <fieldset>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please Suscribe me to the monthyly newsletter</label>
                </fieldset>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section class="employees" id="end-section">
            <h2>We Are Here to Serve You</h2>
            <div>
                <figure>
                    <img src="images/thompson-profile.webp" alt="Photo of Randall Thompson">
                    <figcaption class="names">Randall Thompson</figcaption>
                    <figcaption>Customer Service Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/farrell-profile.webp" alt="Photo of Eliza Farrell">
                    <figcaption class="names">Eliza Farrell</figcaption>
                    <figcaption>HR Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/edwards-profile.webp" alt="Photo of Mark Edwards">
                    <figcaption class="names">Mark Edwards</figcaption>
                    <figcaption>Legal Representative</figcaption>
                </figure>
            </div>
        </section>      
    </main>
    <footer>
        <p>© 2026 🚩 Splash White Water Rafting 🚩 Francisco Gandiola</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook.svg" alt="Facebook logo" width="40">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram.svg" alt="Instagram logo" width="40">
            </a>
            <a href="https://web.whatsapp.com/">
                <img src="images/whatsapp.svg" alt="WhatsApp logo" width="40">
            </a>
        </nav>
    </footer>
</body>
</html>
